<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Piece Season Sprites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="home">
  <main class="hero lab-hero" id="hero">
    <!-- sprite-shaped clouds drifting behind the moss (white puffs in each sprite's outline) -->
    <!-- shipwreck on the shore, behind the moss (anime-styled photo by Aneta Hartmannová, Unsplash) -->
    <div class="wreck" aria-hidden="true"></div>
    <div class="clouds" aria-hidden="true">
      <div class="drift c1"><div class="cloud" style="--shape:url(images/sprites/plundarrgh.webp)"></div></div>
      <div class="drift c2"><div class="cloud" style="--shape:url(images/sprites/re-pete.webp)"></div></div>
      <div class="drift c3"><div class="cloud" style="--shape:url(images/sprites/chester.webp)"></div></div>
      <div class="drift c4"><div class="cloud" style="--shape:url(images/sprites/lil-flacko.webp)"></div></div>
      <div class="drift c5"><div class="cloud" style="--shape:url(images/sprites/halfpeeld.webp)"></div></div>
      <div class="drift c6"><div class="cloud" style="--shape:url(images/sprites/sweet-dreams.webp)"></div></div>
      <div class="drift c7"><div class="cloud" style="--shape:url(images/sprites/wayfinder.webp)"></div></div>
    </div>
    <!-- 3D moss scene from the Tyrrell Lab site (see CREDITS.md) -->
    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="stage" id="stage" aria-hidden="true"></div>

    <div class="hero-text">
      <p class="eyebrow">Fortnite · One Piece season</p>
      <h1>One Piece<br>Season Sprites</h1>
      <p class="tagline">Every sprite from the season, all in one place.</p>
      <a class="btn" href="sprites.html">View sprites</a>
    </div>
    <img class="hero-art" src="images/hero.jpg" alt="Straw hat pirate">
  </main>
  <script>
    // Click (or tap) a sprite cloud to make it dance.
    document.querySelectorAll('.cloud').forEach(c => {
      c.addEventListener('click', () => {
        c.classList.remove('dancing', 'flash');
        void c.offsetWidth;            // restart if it's already dancing
        c.classList.add('dancing', 'flash');
      });
      c.addEventListener('animationend', e => {
        if (e.animationName === 'cloud-groove') c.classList.remove('dancing', 'flash');
      });
    });
  </script>
  <script src="vendor/three.min.js"></script>
  <script src="vendor/hero-scene.js"></script>
</body>
</html>
